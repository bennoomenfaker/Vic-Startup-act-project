          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Combien de labels Startup Act ont été officiellement accordés en Tunisie ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Entre avril 2019 et mars 2026 (85 sessions du Collège des Startups), exactement 1 311 labels ont été accordés (809 par voie directe et 502 via conversion de pré-labels), après élimination des 13 doublons de parsing constatés dans les données brutes."
              }
            },
            {
              "@type": "Question",
              "name": "Que signifie la formule d'entonnoir 623 - 502 = 121 pré-labels ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sur les 623 pré-labels octroyés aux porteurs d'idées non encore immatriculés, 502 ont achevé leur constitution juridique et ont été convertis en labels définitifs. Le solde de 121 pré-labels représente les projets en cours d'incubation ou expirés sans constitution."
              }
            },
            {
              "@type": "Question",
              "name": "Quel est le taux de succès au 1er et 2ème tour devant le Collège des Startups ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "78.4% des startups obtiennent leur label dès leur 1er passage. Pour les candidats ayant fait l'objet d'un premier avis réservé, le taux de succès au 2ème tour (rédemption) est de 64.1%, avec un délai moyen de re-candidature de 4.2 mois."
              }
            }
          ]
        }
      ]
